<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2020" viewBox="0 0 1500 2020">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#2563EB"/></marker><marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#16A34A"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#F97316"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#7E22CE"/></marker><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#DC2626"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#0891B2"/></marker><marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/></marker></defs>
<text x="750.0" y="45" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#111827" text-anchor="middle">诊断请求处理业务流程</text>
<rect x="70" y="85" width="900" height="1680" rx="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/><text x="98" y="133" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="28" font-weight="800" fill="#334155">诊断请求主流程</text>
<rect x="1030" y="85" width="400" height="1680" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/><text x="1058" y="133" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="28" font-weight="800" fill="#334155">异常与回流</text>
<polyline points="520,276 520,350" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="520,446 520,520" fill="none" stroke="#16A34A" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="520,632 520,735" fill="none" stroke="#16A34A" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="710,810 900,810 900,735 1090,735" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<polyline points="520,885 520,1015" fill="none" stroke="#16A34A" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="520,1127 520,1245" fill="none" stroke="#7E22CE" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="1235,785 1235,890" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<polyline points="1235,990 1235,1095" fill="none" stroke="#DC2626" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<polyline points="1090,1145 985,1145 985,1540 830,1540" fill="none" stroke="#F97316" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="872" y="747" width="56" height="34" rx="9" fill="white" stroke="#DC2626" stroke-width="1.5"/><text x="900" y="770" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#DC2626" text-anchor="middle">否</text>
<rect x="517" y="912" width="56" height="34" rx="9" fill="white" stroke="#16A34A" stroke-width="1.5"/><text x="545" y="935" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#16A34A" text-anchor="middle">是</text>
<rect x="937" y="1482" width="56" height="34" rx="9" fill="white" stroke="#F97316" stroke-width="1.5"/><text x="965" y="1505" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#F97316" text-anchor="middle">回流</text>
<rect x="210" y="180" width="620" height="96" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="220.7">学生 / 教师 / 看板 / 路径模块</tspan><tspan x="520.0" y="254.0">发起诊断请求</tspan></text>
<rect x="210" y="350" width="620" height="96" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="407.4">校验身份、课程范围和诊断对象</tspan></text>
<rect x="210" y="520" width="620" height="112" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="568.7">读取画像、课程图谱、测验、作业、</tspan><tspan x="520.0" y="602.0">代码题和行为证据</tspan></text>
<polygon points="520.0,735 710,810.0 520.0,885 330,810.0" fill="#FFEDD5" stroke="#F97316" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="819.4">证据是否足够</tspan></text>
<rect x="210" y="1015" width="620" height="112" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="1063.7">生成诊断结论</tspan><tspan x="520.0" y="1097.0">薄弱点、原因、依据等级、建议动作</tspan></text>
<rect x="210" y="1245" width="620" height="102" rx="16" fill="#F3E8FF" stroke="#7E22CE" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="1305.4">按端返回结果并记录诊断日志</tspan></text>
<rect x="210" y="1490" width="620" height="100" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="520.0" y="1532.7">新证据进入后重新校验</tspan><tspan x="520.0" y="1566.0">形成下一轮诊断</tspan></text>
<rect x="1090" y="685" width="290" height="100" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="1235.0" y="727.7">证据不足</tspan><tspan x="1235.0" y="761.0">说明缺少的证据类型</tspan></text>
<rect x="1090" y="890" width="290" height="100" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="1235.0" y="932.7">提示补充测验、作业</tspan><tspan x="1235.0" y="966.0">或学习记录</tspan></text>
<rect x="1090" y="1095" width="290" height="100" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#172033" text-anchor="middle"><tspan x="1235.0" y="1137.7">等待新证据回流</tspan><tspan x="1235.0" y="1171.0">不输出强结论</tspan></text>
<rect x="150" y="1815" width="1200" height="82" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#172033" text-anchor="middle"><tspan x="750.0" y="1865.0">规则：证据不足时只提示补证，不得把缺失证据当作 0 分并强行诊断。</tspan></text>
</svg>