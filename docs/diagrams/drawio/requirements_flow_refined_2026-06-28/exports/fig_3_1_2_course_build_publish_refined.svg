<rect width="1700" height="2480" fill="#FFFFFF"/>
<text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#111827" text-anchor="middle"><tspan x="850" y="62.0">课程建设、资源绑定与能力关系发布流程</tspan></text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="middle"><tspan x="850" y="112.0">主流程自上而下推进；校验失败、能力缺口和发布退回均在侧边闭环处理。</tspan></text><rect x="70" y="165" width="1560" height="655" rx="24" ry="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="120" y="210.0">一、课程结构与资源底座</tspan></text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="120" y="251.0">教师先录入课程结构与本地资料，系统生成知识图谱并绑定外部学习资源。</tspan></text><rect x="70" y="870" width="1560" height="760" rx="24" ry="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="120" y="915.0">二、岗位能力映射</tspan></text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="120" y="956.0">系统根据目标岗位抽取职业能力，并与课程叶子知识点建立支撑关系。</tspan></text><rect x="70" y="1680" width="1560" height="575" rx="24" ry="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start"><tspan x="120" y="1725.0">三、教师审核与发布</tspan></text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="120" y="1766.0">教师统一确认课程结构、资源、作业和能力映射，通过后发布课程底座。</tspan></text><rect x="610" y="300" width="480" height="88" rx="16" ry="16" fill="#E8F1FF" stroke="#2F6BDE" stroke-width="2.4"/>