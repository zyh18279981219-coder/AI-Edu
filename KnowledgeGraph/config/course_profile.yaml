profile_name: "big-data-default"

# Domain anchors improve concept relevance scoring.
domain_terms:
  - "data"
  - "dataset"
  - "algorithm"
  - "model"
  - "feature"
  - "nosql"
  - "hadoop"
  - "spark"
  - "mllib"
  - "hdfs"
  - "mapreduce"
  - "recommendation"
  - "graph"
  - "network"
  - "matrix"
  - "vector"
  - "数据"
  - "算法"
  - "模型"
  - "特征"
  - "存储"
  - "计算"
  - "推荐"
  - "矩阵"
  - "图"
  - "网络"
  - "流计算"

# Hard block terms are always rejected as concept nodes.
hard_block_terms:
  - "例如"
  - "此外"
  - "同时"
  - "其中"
  - "对于"
  - "我们"
  - "你们"
  - "他们"
  - "我是"
  - "老师"
  - "同学"
  - "本节课"
  - "图片"
  - "分钟"

# Weak block terms are penalized but can still pass if strongly supported.
weak_block_terms:
  - "阶段"
  - "文档"
  - "组合"
  - "复杂度"
  - "记录"
  - "箱"

abstract_terms:
  - "用户"
  - "算法"
  - "模型"
  - "系统"
  - "方法"
  - "过程"
  - "阶段"
  - "组合"
  - "定理"
  - "文档"
  - "结构"
  - "关系"
  - "内容"

discourse_markers:
  - "首先"
  - "其次"
  - "最后"
  - "此外"
  - "同时"
  - "其中"
  - "对于"
  - "因此"
  - "所以"
  - "指出"
  - "转而"
  - "放弃"
  - "我们"
  - "你们"
  - "他们"

action_terms:
  - "使用"
  - "攻击"
  - "加载"
  - "爬取"
  - "顺序"
  - "插入"
  - "更新"
  - "删除"
  - "执行"
  - "出发"
  - "作为"
  - "无需"
  - "仅"
  - "关注"

relation_terms:
  - "相关"
  - "关联"
  - "包含"
  - "组成"
  - "用于"
  - "适用"
  - "支持"
  - "依赖"
  - "比较"

unit_terms:
  - "条"
  - "个"
  - "次"
  - "次方"
  - "字节"
  - "秒"
  - "分钟"
  - "小时"
  - "记录"
  - "箱"
  - "kb"
  - "mb"
  - "gb"
  - "tb"

chapter_stopwords:
  - "课程"
  - "讲稿"
  - "章节"
  - "概述"
  - "介绍"
  - "chapter"

concept_min_score: 1.9
keyword_min_score: 1.2
min_term_length: 2
max_term_length: 36
