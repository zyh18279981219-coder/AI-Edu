video:
  request_timeout_sec: 8
  max_workers: 8
  min_transcript_chars: 80
  transcript_cache_subdir: "video_transcripts"
  prefer_https_domains:
    - "mooc2vod.stu.126.net"
  force_refresh: false
  max_chunk_chars: 260
  evidence_max_chars: 240
  report_candidate_count: 5
  score_weights:
    semantic: 0.45
    keyword: 0.35
    hierarchy: 0.20
  recall:
    bm25_top_k: 30
    keyword_top_k: 30
    rerank_top_k: 8
    min_bm25_score: 0.0
  confidence:
    high_threshold: 0.12
    medium_threshold: 0.08
  query_expansion:
    enabled: true
    include_topic_chapter_terms: true
    synonym_map: {}
  quality_targets:
    transcript_coverage_pct: 85.0
    match_rate_pct: 40.0
  asr:
    enabled: true
    model_size: "tiny"
    device: "cpu"
    compute_type: "int8"
    max_audio_seconds: 120
    hf_endpoint: "https://hf-mirror.com"
    download_root: "KnowledgeGraph/data/intermediate/asr_models"
